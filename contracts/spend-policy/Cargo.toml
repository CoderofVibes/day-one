[package]
name = "spend-policy"
description = "Day One: plant budget, agent spend limits, director approvals, PO escrow and record anchors"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# "unstable" exposes env::ecrecover, the stable host function attest.rs uses for enclave signatures.
near-sdk = { version = "=5.29.1", features = ["unstable"] }
near-contract-standards = "=5.29.1"

[dev-dependencies]
near-sdk = { version = "=5.29.1", features = ["unit-testing", "unstable"] }
cargo-near-build = "=0.11.5"
near-api = "=0.8.6"
near-sandbox = { version = "=0.3.16", features = ["generate"] }
serde_json = "1"
# Signs test decisions as an enclave would (tests/settlement.rs); never in the wasm.
k256 = { version = "0.13", features = ["ecdsa"] }
tokio = { version = "1", features = ["full"] }
